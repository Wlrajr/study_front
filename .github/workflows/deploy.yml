name: Deploy to EC2 with Docker

on:
  push:
    branches: [ main ]

jobs:
  # 1. 빌드 및 ECR 업로드 작업
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/study-front:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/study-front:latest

  # 2. 서버 배포 작업 (추가된 부분)
  deploy:
    needs: build-and-push # 빌드가 성공해야 실행됨
    runs-on: [self-hosted, study] # 우리가 서버에 설정한 라벨
    steps:
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to EC2
        run: |
          # 기존에 돌고 있는 컨테이너가 있다면 중지하고 삭제
          docker stop study-container || true
          docker rm study-container || true
          
          # ECR에서 최신 이미지 가져오기
          docker pull ${{ steps.login-ecr.outputs.registry }}/study-front:latest
          
          # 새 컨테이너 실행
          docker run -d --name study-container \
            --restart always \
            --network app_net \
            -p 5984:5984 \
            ${{ steps.login-ecr.outputs.registry }}/study-front:latest
          
          # 안 쓰는 이미지 정리 (용량 확보)
          docker image prune -f