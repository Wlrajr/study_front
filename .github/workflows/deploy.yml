name: Deploy to EC2 with Docker

on:
  push:
    branches: [ main ]

jobs:
  # 1. 빌드 및 ECR 업로드 작업
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/study-front:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/study-front:latest

  # 2. 서버 배포 작업 (추가된 부분)
  deploy:
    needs: build-and-push
    runs-on: [ self-hosted, study ]
    steps:
      # AWS 자격증명 구성 단계가 deploy에도 들어가야 합니다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2 # 이 부분이 빠져서 에러가 난 거예요!

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to EC2
        run: |
          docker stop study-container || true
          docker rm study-container || true
          docker pull ${{ steps.login-ecr.outputs.registry }}/study-front:latest
          docker run -d --name study-container \
            --restart always \
            --network app_net \
            -p 5984:5984 \
            ${{ steps.login-ecr.outputs.registry }}/study-front:latest
          docker image prune -f